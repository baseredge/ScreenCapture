name: Build and publish latest release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

env:
  LING_REF: b77448ec7e72b1b961d3c6f8f87502d8df72aa5f
  GIFSKI_REF: 61ac230f65374c70f238cb35f9247cd22b4672f1

jobs:
  build-and-release:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout ScreenCapture
        uses: actions/checkout@v6

      - name: Checkout build dependencies
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/xland/Ling.git ..\Ling
          git -C ..\Ling checkout $env:LING_REF
          git clone --filter=blob:none https://github.com/ImageOptim/gifski.git ..\gifski
          git -C ..\gifski checkout $env:GIFSKI_REF

      - name: Build gifski
        shell: pwsh
        run: cargo build --release --manifest-path ..\gifski\Cargo.toml

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) { throw 'Visual Studio with MSBuild was not found.' }
          $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild)) { throw "MSBuild not found: $msbuild" }
          "MSBUILD=$msbuild" >> $env:GITHUB_ENV
          & $msbuild -version

      - name: Build Ling Yoga
        shell: pwsh
        run: '& $env:MSBUILD ..\Ling\yoga\yoga.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=..\Ling\ /m'

      - name: Build Ling
        shell: pwsh
        run: '& $env:MSBUILD ..\Ling\Ling.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=..\Ling\ /m'

      - name: Build ScreenCapture
        shell: pwsh
        run: '& $env:MSBUILD .\ScreenCapture.slnx /t:Build /p:Configuration=Release /p:Platform=x64 /m'

      - name: Package Windows x64 build
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $distDir = Join-Path $env:RUNNER_TEMP 'ScreenCapture-windows-x64'
          $asset = Join-Path $env:RUNNER_TEMP 'ScreenCapture-windows-x64.zip'
          $checksum = Join-Path $env:RUNNER_TEMP 'ScreenCapture-windows-x64.sha256'

          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          Get-ChildItem -LiteralPath $releaseDir -File |
            Where-Object { $_.Extension -notin @('.pdb', '.lib', '.exp', '.iobj', '.ipdb') } |
            Copy-Item -Destination $distDir -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'Lang') -Destination $distDir -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'ReadMe.md') -Destination $distDir -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') -Destination $distDir -Force

          Compress-Archive -Path (Join-Path $distDir '*') -DestinationPath $asset -Force
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $asset)" | Set-Content -LiteralPath $checksum -Encoding ascii

          "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV
          "RELEASE_CHECKSUM=$checksum" >> $env:GITHUB_ENV

      - name: Publish rolling latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'latest'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          @"
          Automated Windows x64 build from main.

          Commit: $env:GITHUB_SHA
          Dependency revisions are pinned in the workflow.
          This rolling release is updated on every push to main.
          "@ | Set-Content -LiteralPath $notes -Encoding utf8

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $repo --target $env:GITHUB_SHA --title "Latest build ($shortSha)" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the latest release.' }
            gh release upload $tag $env:RELEASE_ASSET $env:RELEASE_CHECKSUM --repo $repo --clobber
          }
          else {
            gh release create $tag $env:RELEASE_ASSET $env:RELEASE_CHECKSUM --repo $repo --target $env:GITHUB_SHA --title "Latest build ($shortSha)" --notes-file $notes --latest=false
          }
